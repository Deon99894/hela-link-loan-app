<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hela Link Loan App - Project Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .stat {
            font-size: 32px;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 5px;
        }
        
        .label {
            color: #666;
            font-size: 14px;
        }
        
        .repo-info {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .repo-info h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            color: #666;
            font-weight: 500;
        }
        
        .info-value {
            color: #333;
        }
        
        .badge {
            display: inline-block;
            padding: 5px 10px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 18px;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .links {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .links a {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.2s;
        }
        
        .links a:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏦 Hela Link Loan App</h1>
            <p class="subtitle">A Full-Stack loan application System With User Submission, admin dashboard and SQLite database</p>
        </header>
        
        <div id="content">
            <div class="loading">Loading project data...</div>
        </div>
        
        <div class="links">
            <a href="https://github.com/Deon99894/hela-link-loan-app" target="_blank">📂 View Repository</a>
            <a href="https://github.com/Deon99894/hela-link-loan-app/projects" target="_blank">📊 View Projects</a>
            <a href="https://github.com/Deon99894/hela-link-loan-app/issues" target="_blank">🐛 View Issues</a>
        </div>
    </div>
    
    <script>
        const OWNER = 'Deon99894';
        const REPO = 'hela-link-loan-app';
        
        async function loadProjectData() {
            try {
                const [repoData, issuesData] = await Promise.all([
                    fetch(`https://api.github.com/repos/${OWNER}/${REPO}`).then(r => r.json()),
                    fetch(`https://api.github.com/repos/${OWNER}/${REPO}/issues?state=all&per_page=100`).then(r => r.json())
                ]);
                
                const openIssues = issuesData.filter(i => i.state === 'open').length;
                const closedIssues = issuesData.filter(i => i.state === 'closed').length;
                
                const content = document.getElementById('content');
                content.innerHTML = `
                    <div class="repo-info">
                        <h2>📋 Repository Information</h2>
                        <div class="info-row">
                            <span class="info-label">Default Branch:</span>
                            <span class="info-value">${repoData.default_branch}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Language:</span>
                            <span class="info-value"><span class="badge">${repoData.language || 'N/A'}</span></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Visibility:</span>
                            <span class="info-value"><span class="badge" style="background: #28a745;">${repoData.visibility}</span></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Created:</span>
                            <span class="info-value">${new Date(repoData.created_at).toLocaleDateString()}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Last Updated:</span>
                            <span class="info-value">${new Date(repoData.updated_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                    
                    <div class="dashboard">
                        <div class="card">
                            <h2>📂 Repository Stats</h2>
                            <div class="stat">${repoData.stargazers_count}</div>
                            <div class="label">Stars</div>
                        </div>
                        <div class="card">
                            <h2>🔓 Open Issues</h2>
                            <div class="stat">${openIssues}</div>
                            <div class="label">Pending Tasks</div>
                        </div>
                        <div class="card">
                            <h2>✅ Closed Issues</h2>
                            <div class="stat">${closedIssues}</div>
                            <div class="label">Completed Tasks</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error loading data:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        loadProjectData();
    </script>
</body>
</html>
